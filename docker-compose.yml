name: lobbygraph

services:
  neo4j:
    container_name: neo4j
    image: neo4j:2026.10.1-community
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 2G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  loader:
    build: ./lobbygraph
    profiles: ["loader"]
    environment:
      STORAGE_ACCOUNT: stlobbygraphdev
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    depends_on: [neo4j]

  app:
    build: ./app
    restart: always
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      APP_PASSWORD_SUFFIX: ${APP_PASSWORD_SUFFIX}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
    depends_on: [neo4j]

  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./app/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  neo4j_data:
  neo4j_logs:
  caddy_data:
  caddy_config:
